    <style>
      #aide-banner {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;

        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: #1a2150;
        color: #fbbf24;
        border: 1px solid rgba(251, 191, 36, 0.3);
        border-radius: 9999px;
        padding: 0.6rem 1.2rem;

        text-decoration: none;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
